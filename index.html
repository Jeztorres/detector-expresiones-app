<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Detector de Expresiones Faciales</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Aplicación web para detección de gestos faciales en tiempo real usando MediaPipe">
  <style>
    body{font-family: system-ui, Arial; margin:0; padding:16px; background:#0b0f14; color:#e8eef5}
    .header{text-align:center; margin-bottom:32px}
    .header h1{color:#58a6ff; margin-bottom:8px}
    .header p{opacity:0.8; margin:0}
    .row{display:flex; gap:16px; flex-wrap:wrap; justify-content:center}
    video, canvas{border-radius:12px; max-width:100%; border:2px solid #30363d; width:640px; height:480px; object-fit:cover}
    .card{background:#161b22; padding:20px; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.4); border:1px solid #30363d}
    .kpi{font-size:14px; opacity:.85; margin:8px 0}
    .kpi b{font-size:24px; color:#58a6ff}
    #status{margin-top:12px; color:#9ad1ff; font-weight:500}
    .footer{text-align:center; margin-top:32px; opacity:0.7; font-size:14px}
    .github-link{color:#58a6ff; text-decoration:none}
    .github-link:hover{text-decoration:underline}
  </style>

  <!-- MediaPipe Face Mesh & drawing utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <!-- OpenCV.js (opcional, solo para filtro gris de ejemplo) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="cvReady=true;"></script>
  <script>var cvReady=false;</script>
  
  <!-- API estática para GitHub Pages -->
  <script src="api/gestos.js"></script>
</head>
<body>
  <div class="header">
    <h1>🎭 Detector de Expresiones Faciales</h1>
    <p>Detección en tiempo real usando MediaPipe Face Mesh</p>
  </div>

  <div class="row">
    <div class="card">
      <video id="video" playsinline style="width:640px;height:480px;"></video>
      <div id="status">Inicializando cámara…</div>
    </div>
    <div class="card">
      <canvas id="canvasOutput" width="640" height="480"></canvas>
      <div class="kpi">Parpadeos: <b id="parpadeo-counter">0</b></div>
      <div class="kpi">Cejas arqueadas: <b id="ceja-counter">0</b></div>
      <div class="kpi">Bocas abiertas: <b id="boca-counter">0</b></div>
    </div>
  </div>

  <div class="footer">
    <p>🚀 <a href="https://github.com/Jeztorres/detector-expresiones-app" class="github-link">Ver en GitHub</a></p>
    <button id="exportBtn" onclick="exportarDatos()" style="margin-top: 10px; padding: 8px 16px; background: #58a6ff; color: white; border: none; border-radius: 6px; cursor: pointer;">
      📊 Exportar Datos a MySQL
    </button>
  </div>

  <script>
    // --- CONFIG API ---
    // Detectar si estamos en GitHub Pages o localhost
    const isGitHubPages = window.location.hostname.includes('github.io');

    document.addEventListener("DOMContentLoaded", () => {
      console.log("🚀 DOM cargado, iniciando aplicación...");
      
      const videoElement = document.getElementById('video');
      const canvasElement = document.getElementById('canvasOutput');
      const canvasCtx = canvasElement.getContext('2d');
      const status = document.getElementById('status');

      const cejaCounterEl = document.getElementById('ceja-counter');
      const bocaCounterEl = document.getElementById('boca-counter');
      const parpadeoCounterEl = document.getElementById('parpadeo-counter');

      let cejaCount = 0, bocaCount = 0, parpadeoCount = 0;

      // ======= ESTADOS ACTUALES =======
      let estadoBoca = "cerrada";   // 'abierta' | 'cerrada'
      let estadoCejas = "normal";   // 'arqueadas' | 'normal'
      let estadoParp  = "abierto";  // 'cerrado' | 'abierto'

      // ======= CALIBRACIÓN / PARPADEO =======
      let frameCounter = 0;
      const framesParaCalibrar = 100;
      const earBufferCalibracion = [];
      const cejaBufferCalibracion = [];
      let earAbiertoCalibrado = null;
      let ratioCejaNeutralPromedio = null;

      let earEma = null;
      let framesPorDebajo = 0;
      let refractario = 0;
      let umbralCierre = null;
      let umbralApertura = null;

      // ======= PARÁMETROS =======
      const UMBRAL_BOCA_ABIERTA = 0.05;
      const EAR_EMA_ALPHA = 0.4;
      const FRAMES_CERRADO = 2;
      const REFRACTARIO_FRAMES = 6;
      const FACTOR_CIERRE = 0.78;
      const FACTOR_APERTURA = 0.88;
      const FACTOR_UMBRAL_CEJA = 1.20;

      function onResults(results) {
        frameCounter++;
        canvasCtx.save();

        // Dibujo base (OpenCV si está listo)
        if (typeof cvReady !== "undefined" && cvReady) {
          canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
          let src = cv.imread(canvasElement);
          let gray = new cv.Mat();
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
          cv.imshow(canvasElement, gray);
          src.delete(); gray.delete();
        } else {
          canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
          canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        }

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const lm = results.multiFaceLandmarks[0];

          drawConnectors(canvasCtx, lm, FACEMESH_TESSELATION, { color: '#C0C0C070', lineWidth: 1 });
          drawConnectors(canvasCtx, lm, FACEMESH_RIGHT_EYE, { color: '#FF3030' });
          drawConnectors(canvasCtx, lm, FACEMESH_LEFT_EYE, { color: '#30FF30' });
          drawConnectors(canvasCtx, lm, FACEMESH_LIPS, { color: '#E0E0E0' });

          detectarEstados(lm);
        }
        canvasCtx.restore();
      }

      function detectarEstados(lm) {
        const distCeja = Math.abs(lm[159].y - lm[105].y);
        const anchoOjo = Math.abs(lm[33].x - lm[133].x);
        const ratioCeja = distCeja / anchoOjo;

        const distLabios = Math.abs(lm[13].y - lm[14].y);

        const earIzq = calcularEAR(lm, [33, 160, 158, 133, 144, 153]);
        const earDer = calcularEAR(lm, [362, 385, 387, 263, 373, 380]);
        const earInst = (earIzq + earDer) / 2;

        // Calibración
        if (frameCounter < framesParaCalibrar) {
          status.textContent = `Calibrando... Rostro neutral (${frameCounter}%)`;
          earBufferCalibracion.push(earInst);
          cejaBufferCalibracion.push(ratioCeja);
          return;
        } else if (frameCounter === framesParaCalibrar) {
          earAbiertoCalibrado = percentil(earBufferCalibracion, 95);
          umbralCierre   = earAbiertoCalibrado * FACTOR_CIERRE;
          umbralApertura = earAbiertoCalibrado * FACTOR_APERTURA;

          ratioCejaNeutralPromedio = calcularPromedio(cejaBufferCalibracion);
          status.textContent = 'Detección de Alta Precisión ✅';
          return;
        }

        // --- Parpadeo: transiciones 'cerrado' <-> 'abierto' ---
        earEma = (earEma === null) ? earInst : (EAR_EMA_ALPHA * earInst + (1 - EAR_EMA_ALPHA) * earEma);
        if (refractario > 0) refractario--;

        if (earEma < umbralCierre) {
          if (estadoParp === "abierto") {
            framesPorDebajo++;
            if (framesPorDebajo >= FRAMES_CERRADO && refractario === 0) {
              estadoParp = "cerrado";
              parpadeoCount++; parpadeoCounterEl.textContent = parpadeoCount;
              refractario = REFRACTARIO_FRAMES;
              enviarEvento("parpadeo", "cerrado");
            }
          }
        } else if (earEma > umbralApertura) {
          if (estadoParp === "cerrado") {
            estadoParp = "abierto";
            framesPorDebajo = 0;
            enviarEvento("parpadeo", "abierto");
          } else {
            framesPorDebajo = 0;
          }
        }

        // --- Cejas: 'arqueadas' / 'normal' ---
        const cejaArq = ratioCeja > ratioCejaNeutralPromedio * FACTOR_UMBRAL_CEJA ? "arqueadas" : "normal";
        if (cejaArq !== estadoCejas) {
          estadoCejas = cejaArq;
          if (cejaArq === "arqueadas") { cejaCount++; cejaCounterEl.textContent = cejaCount; }
          enviarEvento("cejas", cejaArq);
        }

        // --- Boca: 'abierta' / 'cerrada' ---
        const bocaNow = distLabios > UMBRAL_BOCA_ABIERTA ? "abierta" : "cerrada";
        if (bocaNow !== estadoBoca) {
          estadoBoca = bocaNow;
          if (bocaNow === "abierta") { bocaCount++; bocaCounterEl.textContent = bocaCount; }
          enviarEvento("boca", bocaNow);
        }
      }

      // ======= Helpers geométricos =======
      function calcularEAR(lm, idx) {
        const p1 = lm[idx[0]], p2 = lm[idx[1]], p3 = lm[idx[2]], p4 = lm[idx[3]], p5 = lm[idx[4]], p6 = lm[idx[5]];
        const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        return (d(p2, p6) + d(p3, p5)) / (2 * d(p1, p4));
      }
      function calcularPromedio(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
      function percentil(arr, p){
        if(!arr.length) return 0;
        const a=[...arr].sort((x,y)=>x-y), r=(p/100)*(a.length-1);
        const lo=Math.floor(r), hi=Math.ceil(r);
        return lo===hi ? a[lo] : a[lo] + (a[hi]-a[lo])*(r-lo);
      }

      // ======= API =======
      async function enviarEvento(tipo, estado) {
        console.log(`🎭 Gesto detectado: ${tipo} - ${estado}`);
        
        try {
          // Usar la API que se conecta directamente a MySQL en la nube
          const gesto = await window.GestosAPI.save(tipo, estado);
          console.log(`✅ Gesto procesado: ${tipo} - ${estado}`);
          
          // Mostrar estadísticas
          const todosGestos = await window.GestosAPI.getAll();
          console.log(`📊 Total de gestos en la nube: ${todosGestos.length}`);
          
        } catch (err) {
          console.log(`❌ Error procesando gesto: ${err.message}`);
        }
      }

      // ======= Inicializar MediaPipe + Cámara =======
      // Inicialización principal
      async function initializeCamera() {
        try {
          const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
          });
          
          faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          
          faceMesh.onResults(onResults);

          const camera = new Camera(videoElement, {
            onFrame: async () => { 
              await faceMesh.send({ image: videoElement }); 
            },
            width: 640, 
            height: 480
          });

          await camera.start();
          status.textContent = "Cámara inicializada ✅";
          console.log("✅ Cámara y MediaPipe inicializados correctamente");
          
        } catch (error) {
          console.error("❌ Error inicializando cámara:", error);
          status.textContent = "Error: Permite el acceso a la cámara en el navegador.";
          alert("Activa los permisos de cámara (candado en la barra de direcciones).");
        }
      }

      // Inicializar cuando el DOM esté listo
      initializeCamera();
    });

    // Función global para exportar datos
    async function exportarDatos() {
      try {
        const todosGestos = await window.GestosAPI.getAll();
        
        if (todosGestos.length === 0) {
          alert('No hay datos para exportar');
          return;
        }
        
        // Crear archivo JSON con los datos
        const dataStr = JSON.stringify(todosGestos, null, 2);
        const dataBlob = new Blob([dataStr], {type: 'application/json'});
        
        // Descargar archivo
        const link = document.createElement('a');
        link.href = URL.createObjectURL(dataBlob);
        link.download = `gestos_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        
        console.log(`📊 Exportados ${todosGestos.length} gestos desde MySQL`);
        alert(`✅ Exportados ${todosGestos.length} gestos desde MySQL a archivo JSON`);
        
        // Mostrar resumen en consola
        const resumen = {
          parpadeos: todosGestos.filter(g => g.tipo === 'parpadeo').length,
          cejas: todosGestos.filter(g => g.tipo === 'cejas').length,
          boca: todosGestos.filter(g => g.tipo === 'boca').length,
          total: todosGestos.length
        };
        
        console.log('📈 Resumen de gestos desde MySQL:', resumen);
        
      } catch (error) {
        console.error('❌ Error exportando datos:', error);
        alert('Error exportando datos: ' + error.message);
      }
    }
  </script>
</body>
</html>
