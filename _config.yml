# GitHub Pages configuration
title: "Detector de Expresiones Faciales"
description: "Sistema de detección de gestos faciales en tiempo real"
baseurl: "/detector-expresiones-app"
url: "https://jeztorres.github.io"

# Configuración para HTTPS
plugins:
  - jekyll-redirect-from

# Configuración de seguridad
security:
  headers:
    Content-Security-Policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://docs.opencv.org; media-src 'self' blob:; camera-src 'self'"
